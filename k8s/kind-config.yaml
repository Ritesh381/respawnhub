# Local cluster: one control plane (also runs the ingress controller on
# ports 80/443 of this machine) and two workers for the app.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: respawnhub
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
