# Scenario 3: a second copy of the backend started with the wrong database
# password. Apply, then work out why it keeps restarting.
apiVersion: v1
kind: Secret
metadata:
  name: lab-wrong-db
  namespace: respawnhub
  labels:
    lab: troubleshooting
stringData:
  password: not-the-real-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-crashloop
  namespace: respawnhub
  labels:
    lab: troubleshooting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-crashloop
  template:
    metadata:
      labels:
        app: lab-crashloop
    spec:
      containers:
        - name: backend
          # Same image the real backend runs; swap in the current tag from
          # helm/respawnhub/values.yaml before applying.
          image: ghcr.io/ritesh381/respawnhub-backend:IMAGE_TAG
          env:
            - name: DB_HOST
              value: respawnhub-postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-wrong-db
                  key: password
