{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "respawnhub.fullname" . }}-backend
  labels:
    {{- include "respawnhub.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "respawnhub.selector" (dict "root" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "respawnhub.fullname" . }}-dashboard
  labels:
    {{- include "respawnhub.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  respawnhub.json: |-
    {{- .Files.Get "dashboards/respawnhub.json" | nindent 4 }}
{{- end }}
