{{- if .Values.ingress.enabled }}
{{- $full := include "respawnhub.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "respawnhub.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-backend
                port:
                  name: http
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-backend
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-frontend
                port:
                  name: http
{{- end }}
