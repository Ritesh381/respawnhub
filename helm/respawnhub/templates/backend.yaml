{{- $name := printf "%s-backend" (include "respawnhub.fullname" .) -}}
{{- $sel := dict "root" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "respawnhub.componentLabels" $sel | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "respawnhub.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "respawnhub.componentLabels" $sel | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for Postgres so the first migration does not crash the pod.
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "respawnhub.fullname" . }}-postgres -p 5432; do echo waiting for postgres; sleep 2; done
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: {{ include "respawnhub.image" $sel }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | trunc 7 | quote }}
            - name: CAFE_TZ
              value: {{ .Values.backend.cafeTimezone | quote }}
            - name: DB_HOST
              value: {{ include "respawnhub.fullname" . }}-postgres
            - name: DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgres.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "respawnhub.dbSecret" . }}
                  key: password
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "respawnhub.componentLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "respawnhub.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
